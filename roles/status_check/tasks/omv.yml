---
- name: List the exports served by this host
  ansible.builtin.command: showmount -e localhost
  register: status_check_exports
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check that the share is exported
  ansible.builtin.assert:
    that: omv_nfs_export_path in status_check_exports.stdout
    success_msg: "OK    OMV exports {{ omv_nfs_export_path }} over NFS"
    fail_msg: "FAIL  OMV does not export {{ omv_nfs_export_path }} over NFS"
